[package]
name = "runetex"
version = "0.2.0"
edition = "2024"
description = "A native Rune LaTeX editor"
license = "MIT"
default-run = "runetex"

[[bin]]
name = "runetex-setup"
path = "src/setup/main.rs"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "a05683be96cbd725ca1fbb34810368309ac534a5", default-features = false, features = ["accessibility", "embedded-fonts", "native-file-dialog", "tooling"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10.9"
url = "2"
fontique = { version = "0.12", default-features = false, features = ["std", "system", "fontconfig-dlopen"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Console", "Win32_System_Registry"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }

[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "a05683be96cbd725ca1fbb34810368309ac534a5" }
winit = { git = "https://github.com/anomalyco/rune", rev = "a05683be96cbd725ca1fbb34810368309ac534a5" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "a05683be96cbd725ca1fbb34810368309ac534a5" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "a05683be96cbd725ca1fbb34810368309ac534a5" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
codegen-units = 16
incremental = true
